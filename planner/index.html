<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2214%22 font-size=%2214%22%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Planner · OSRS Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../core/theme.css">
<style>
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select, input { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 14px var(--sans); }
  input[type=number] { width: 80px; font-family: var(--mono); }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 7px 14px; font: 500 14px var(--sans); cursor: pointer; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 14px; font: 500 13px var(--sans); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 6px 4px 12px; font-size: 14px; }
  .chip button { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
  #goals { display: flex; gap: 8px; flex-wrap: wrap; }
  #summary { display: flex; gap: 28px; flex-wrap: wrap; font: 18px var(--mono); }
  #summary .lbl { display: block; font: 12px var(--sans); color: var(--faint); }
  #warnings { margin: 0; padding-left: 18px; color: var(--gp-low); font-size: 14px; }
  #warnings li.error { list-style: none; margin: 0 0 10px -18px; padding: 10px 12px; border: 1px solid var(--cost); border-radius: 8px; color: var(--text); background: color-mix(in srgb, var(--cost) 12%, transparent); }
  #steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .step .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .step .n { font: 12px var(--mono); color: var(--faint); min-width: 22px; }
  .step .right { margin-left: auto; font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .step.quest { border-left: 3px solid #7fb7ff; } .step.kc { border-left: 3px solid var(--cost); }
  .step.gp { border-left: 3px solid var(--gp-high); } .step.train { border-left: 3px solid var(--accent); }
  .segs { list-style: none; margin: 8px 0 0 30px; padding: 0; display: grid; gap: 6px; }
  .segs li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .segs .lv { font-family: var(--mono); color: var(--muted); min-width: 56px; }
  .segs select { max-width: 420px; }
  .segs .meta { font-family: var(--mono); color: var(--muted); font-size: 13px; }
  .segs li.swapped select { border-color: var(--accent); }
  .block-head { list-style: none; display: flex; align-items: center; gap: 8px; margin: 18px 0 2px; color: var(--muted); font: 600 13px var(--sans); letter-spacing: .02em; }
  .block-head:first-child { margin-top: 0; }
  .move { display: inline-flex; flex-direction: column; margin-right: 6px; vertical-align: middle; }
  .move button { font: 11px/1 var(--mono); padding: 1px 5px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .move button:first-child { border-radius: 4px 4px 0 0; } .move button:last-child { border-radius: 0 0 4px 4px; border-top: 0; }
  .move button:hover:not([disabled]) { color: var(--accent); border-color: var(--accent); }
  .move button[disabled] { opacity: .3; cursor: default; }
  button.reset { font: inherit; font-size: 0.8rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; margin-left: 6px; white-space: nowrap; }
  button.reset:hover { background: var(--accent); color: var(--bg); }
  .step.changed { box-shadow: 0 0 0 1px var(--accent); }
  .step.changed select, .step.kc.changed select { border-color: var(--accent); }
  #swaps-note { color: var(--accent); }
  .x, .linkbtn { background: transparent; border: 0; color: var(--accent); cursor: pointer; font: 12px var(--sans); text-decoration: underline; padding: 0; }
  .note { flex-basis: 100%; color: var(--faint); font-size: 12.5px; margin-left: 66px; }
  .step > .note { margin-left: 30px; }
  .cost { color: var(--cost); } .gain { color: var(--gp-high); } .wild { color: #ff9b6b; } .muted { color: var(--muted); }
  a { color: var(--accent); }
  .error { color: var(--cost); }
</style>
</head>
<body>
<main class="page">
  <div style="display:grid;gap:8px">
    <h1>Goal Planner</h1>
    <p>Add goals and get an ordered plan: the quests and levels they need, how to train each range, and when to make money. Swap any training method for another of the same skill and the plan recalculates, including how much money you need to make.</p>
    <p id="acct-note" style="font-size:14px"></p>
  </div>
  <section class="panel">
    <div class="row">
      <select id="goal-type" aria-label="Goal type">
        <option value="level">Reach a level</option><option value="maxcape">Max cape (all 99s)</option><option value="quest">Complete a quest</option>
        <option value="kc">Boss kill count</option><option value="milestone">Milestone (e.g. Infernal cape)</option><option value="gp">Make GP</option>
      </select>
      <span id="goal-fields" class="row"></span>
      <button type="button" class="btn" id="add-goal">Add goal</button>
    </div>
    <div id="goals"></div>
    <div class="row">
      <span class="muted" style="font-size:13px">Training style</span>
      <div class="seg" id="intensity" role="group" aria-label="Training style">
        <button type="button" data-i="fastest">Fastest</button><button type="button" data-i="balanced">Balanced</button><button type="button" data-i="afk">AFK</button>
      </div>
      <span id="swaps-note" class="muted" style="font-size:13px"></span>
    </div>
  </section>
  <div id="summary"></div>
  <ul id="warnings"></ul>
  <ol id="steps"></ol>
  <datalist id="quest-names"></datalist>
</main>
<script type="module" src="planner.js"></script>
<script type="module" src="../core/nav.js" data-active="planner"></script>
</body>
</html>
