name: Fetch DPS sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_dps_sources.py
      - name: Commit the fetched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/cache/dps
          git diff --cached --quiet && echo "Nothing changed." || (git commit -m "Fetch DPS sources" && git push)
